services:
  - type: web
    name: hyperpulse-telemetry
    env: node
    plan: standard
    buildCommand: npm run install:all && npm run build
    startCommand: npm run server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: SIMULATOR_ENABLED
        value: true
      - key: BATCH_INTERVAL_MS
        value: 500
      - key: BATCH_SIZE
        value: 200
